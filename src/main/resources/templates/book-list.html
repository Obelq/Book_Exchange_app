<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Book List</title>
  <meta charset="UTF-8" />
  <style>
    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f4f4f4;
    }
    a {
      color: #2a5d9f;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .container {
      width: 90%;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Available Books</h1>

  <table>
    <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Category</th>
      <th>Status</th>
      <th>Details</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterate over books list -->
    <tr th:each="book : ${books}">
      <td th:text="${book.title}">Book Title</td>
      <td th:text="${book.author}">Author Name</td>
      <td th:text="${book.category}">Category</td>
      <td th:text="${book.status}">Status</td>
      <td>
        <a th:href="@{/books/{id}(id=${book.id})}">View</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
