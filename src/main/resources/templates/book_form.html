<!-- templates/book_form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Book</title>
</head>
<body>
<h1>Add New Book</h1>

<form th:action="@{/books/save}" th:object="${book}" method="post">
    <label>Title: <input type="text" th:field="*{title}" required/></label><br/>
    <label>Author: <input type="text" th:field="*{author}" required/></label><br/>
    <label>Category:
        <select th:field="*{category}" required>
            <option value="" disabled selected>Select category</option>
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
        </select>
    </label><br/>


    <label>Description: <textarea th:field="*{description}"></textarea></label><br/>
    <label>Status:
        <select th:field="*{status}">
            <option th:value="AVAILABLE">AVAILABLE</option>
            <option th:value="RESERVED">RESERVED</option>
            <option th:value="BORROWED">BORROWED</option>
        </select>
    </label><br/>
    <button type="submit">Save</button>
</form>

<div th:if="${error}" style="color:red;">
    <p th:text="${error}"></p>
</div>

</body>
</html>
